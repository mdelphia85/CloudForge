name: cloudforge-onprem

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: cloudforge
      POSTGRES_DB: cloudforge
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudforge -d cloudforge"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  cloudforge:
    image: cloudforge-onprem:local
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_NAME: cloudforge
      DB_USER: cloudforge
      DB_PASSWORD_FILE: /run/secrets/postgres_password
      LICENSE_PUBLIC_KEY_FILE: /run/secrets/license_public_key
      BOOTSTRAP_ADMIN_TOKEN_FILE: /run/secrets/bootstrap_token
      APP_ORIGIN: ${APP_ORIGIN:?Set an exact HTTP or HTTPS application origin}
      NODE_ENV: production
      PORT: 3000
    secrets:
      - postgres_password
      - license_public_key
      - bootstrap_token
    command: ["node", "deploy/onprem/entrypoint.mjs"]
    ports:
      # Keep on loopback by default; expose LAN access through a separately managed TLS reverse proxy.
      - "${CLOUDFORGE_BIND:-127.0.0.1}:${CLOUDFORGE_PORT:-3000}:3000"
    networks:
      - internal

volumes:
  postgres_data:

networks:
  internal:
    internal: false

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  license_public_key:
    file: ./secrets/license-public-key.pem
  bootstrap_token:
    file: ./secrets/bootstrap-admin-token.txt
