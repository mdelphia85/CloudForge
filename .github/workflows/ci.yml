name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  quality:
    name: Lint, typecheck and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm ci --prefix gateway
      - run: npm test --prefix gateway

  integration:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          # Throwaway database that exists only for this job; it holds no real data.
          POSTGRES_USER: cloudforge_test
          POSTGRES_PASSWORD: ci_only_not_a_secret
          POSTGRES_DB: cloudforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cloudforge_test -d cloudforge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Never DATABASE_URL: the integration harness refuses to fall back to it.
      TEST_DATABASE_URL: postgresql://cloudforge_test:ci_only_not_a_secret@localhost:5432/cloudforge_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm ci --prefix gateway
      - run: npm run test:integration

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --prefix gateway --omit=dev --audit-level=high

  onprem:
    name: On-premises container and database-role smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Prepare ephemeral test secrets
        run: |
          set -euo pipefail
          umask 077
          mkdir -p secrets
          openssl rand -hex 32 > secrets/postgres-admin-password.txt
          openssl rand -hex 32 > secrets/postgres-app-password.txt
          openssl rand -hex 32 > secrets/bootstrap-admin-token.txt
          openssl genpkey -algorithm Ed25519 -out /tmp/cloudforge-ci-private.pem
          openssl pkey -in /tmp/cloudforge-ci-private.pem -pubout -out secrets/license-public-key.pem
          rm -f /tmp/cloudforge-ci-private.pem
      - name: Build and launch disposable on-premises stack
        env:
          APP_ORIGIN: http://localhost:3000
        run: |
          set -euo pipefail
          docker compose build
          docker compose up -d --no-build
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/api/health/ready >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --show-error --silent http://127.0.0.1:3000/api/health/ready
      - name: Verify restricted app database role and first administrator
        env:
          APP_ORIGIN: http://localhost:3000
        run: |
          set -euo pipefail
          role_flags=$(docker compose exec -T postgres sh -c \
            'PGPASSWORD=$(cat /run/secrets/postgres_admin_password) psql -U cloudforge_admin -d cloudforge -Atc "SELECT rolsuper,rolbypassrls FROM pg_roles WHERE rolname='\''cloudforge_app'\''"')
          test "$role_flags" = "f|f"
          token=$(cat secrets/bootstrap-admin-token.txt)
          status=$(curl --silent --show-error -o /tmp/cloudforge-bootstrap.json -w '%{http_code}' \
            -H 'Origin: http://localhost:3000' \
            -H 'Content-Type: application/json' \
            --data "{\"bootstrapToken\":\"$token\",\"email\":\"ci-owner@example.test\",\"displayName\":\"CI Owner\",\"password\":\"Strong-CI-Account-2026!\"}" \
            http://127.0.0.1:3000/api/auth/bootstrap)
          test "$status" = "201"
          grep -q '"role":"admin"' /tmp/cloudforge-bootstrap.json
      - name: Verify database backup and full restore, including engineering file bytes
        env:
          APP_ORIGIN: http://localhost:3000
        run: |
          set -euo pipefail
          trap 'rm -f /tmp/cloudforge-restore-ci.dump' EXIT
          docker compose exec -T postgres sh -ec '
            export PGPASSWORD="$(cat /run/secrets/postgres_admin_password)"
            psql -U cloudforge_admin -d cloudforge -v ON_ERROR_STOP=1
          ' <<'SQL'
          INSERT INTO inventory_items(sku,name,category,unit,reorder_point,created_by)
            SELECT 'RESTORE-BOLT','Backed-up fastener','Mechanical','ea',20,id FROM users
            WHERE email='ci-owner@example.test';
          INSERT INTO projects(code,name,customer,created_by)
            SELECT 'RESTORE-TEST','Recovery test project','CI Manufacturer',id FROM users
            WHERE email='ci-owner@example.test';
          INSERT INTO engineering_documents(project_id,title,kind,created_by)
            SELECT p.id,'Recovered PLC program','plc',u.id
              FROM projects p CROSS JOIN users u
             WHERE p.code='RESTORE-TEST' AND u.email='ci-owner@example.test';
          INSERT INTO engineering_revisions(document_id,revision,file_name,content_type,
            byte_size,sha256,file_data,uploaded_by)
            SELECT d.id,1,'backup-verify.bin','application/octet-stream',4,
              repeat('a',64),decode('DEADBEEF','hex'),u.id
              FROM engineering_documents d CROSS JOIN users u
             WHERE d.title='Recovered PLC program' AND u.email='ci-owner@example.test';
          SQL
          docker compose exec -T postgres sh -ec '
            export PGPASSWORD="$(cat /run/secrets/postgres_admin_password)"
            pg_dump -U cloudforge_admin -d cloudforge -Fc --no-owner --no-acl
          ' > /tmp/cloudforge-restore-ci.dump
          test -s /tmp/cloudforge-restore-ci.dump
          docker compose exec -T postgres sh -ec '
            export PGPASSWORD="$(cat /run/secrets/postgres_admin_password)"
            createdb -U cloudforge_admin cloudforge_restore_ci
          '
          docker compose exec -T postgres sh -ec '
            export PGPASSWORD="$(cat /run/secrets/postgres_admin_password)"
            pg_restore -U cloudforge_admin -d cloudforge_restore_ci --no-owner --no-acl
          ' < /tmp/cloudforge-restore-ci.dump
          inventory=$(docker compose exec -T postgres sh -ec '
            export PGPASSWORD="$(cat /run/secrets/postgres_admin_password)"
            psql -U cloudforge_admin -d cloudforge_restore_ci -Atc               "SELECT count(*) FROM inventory_items WHERE sku='''RESTORE-BOLT'''"
          ')
          test "$inventory" = "1"
          program=$(docker compose exec -T postgres sh -ec '
            export PGPASSWORD="$(cat /run/secrets/postgres_admin_password)"
            psql -U cloudforge_admin -d cloudforge_restore_ci -Atc               "SELECT encode(file_data,'''hex''') FROM engineering_revisions WHERE file_name='''backup-verify.bin'''"
          ')
          test "$program" = "deadbeef"
          original=$(docker compose exec -T postgres sh -ec '
            export PGPASSWORD="$(cat /run/secrets/postgres_admin_password)"
            psql -U cloudforge_admin -d cloudforge -Atc               "SELECT count(*) FROM schema_migrations"
          ')
          restored=$(docker compose exec -T postgres sh -ec '
            export PGPASSWORD="$(cat /run/secrets/postgres_admin_password)"
            psql -U cloudforge_admin -d cloudforge_restore_ci -Atc               "SELECT count(*) FROM schema_migrations"
          ')
          test "$original" = "$restored"
          echo "Disposable PostgreSQL restore validated: inventory, binary engineering revision and schema versions."
      - name: Diagnostic logs on failure
        if: failure()
        env:
          APP_ORIGIN: http://localhost:3000
        run: docker compose logs --tail=80
      - name: Remove disposable containers and test volumes
        if: always()
        env:
          APP_ORIGIN: http://localhost:3000
        run: docker compose down -v --remove-orphans
